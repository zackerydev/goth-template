version: 3
workdir: .
allow:
  depOnAnyVendor: false
  deepScan: true
  ignoreNotFoundComponents: true
exclude:
  - .worktrees
excludeFiles:
  - "^.*_test\\.go$"
components:
  cmd:
    in: cmd/*
  server:
    in: internal/server
  handler:
    in: internal/handler
  contact:
    in: internal/contact
  assets:
    in: assets
  templates:
    in: templates
vendors:
  sqlite:
    in: modernc.org/sqlite
deps:
  cmd:
    mayDependOn:
      - server
      - handler
      - templates
      - contact
  server:
    mayDependOn:
      - handler
      - assets
  handler:
    mayDependOn:
      - templates
      - contact
  contact:
    mayDependOn:
      - contact
    canUse:
      - sqlite
  # Leaf components self-reference only to satisfy go-arch-lint's required rule shape.
  assets:
    mayDependOn:
      - assets
  templates:
    mayDependOn:
      - templates
