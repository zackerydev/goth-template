version: "2"

run:
  timeout: 2m
  relative-path-mode: gomod
  modules-download-mode: readonly
  tests: true

linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - decorder
    - durationcheck
    - errcheck
    - funlen
    - errorlint
    - errname
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gocritic
    - gosec
    - govet
    - grouper
    - iface
    - inamedparam
    - ineffassign
    - interfacebloat
    - ireturn
    - modernize
    - nilerr
    - nilnesserr
    - nolintlint
    - paralleltest
    - predeclared
    - revive
    - staticcheck
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unused
    - usestdlibvars
    - whitespace

  settings:
    funlen:
      lines: 60
      statements: 40
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: argument-limit
          arguments: [4]
        - name: function-result-limit
          arguments: [2]

  exclusions:
    generated: strict
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: strict
